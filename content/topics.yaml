tracks:
  beginner:
    title: "🌱 Начинающий"
    description: |
      Фундамент: синтаксис, типы, циклы, функции, ООП. После прохождения ты сможешь
      писать собственные скрипты и понимать чужой код. Базовый уровень — обязательная
      ступень перед «Продвинутым».
    topics:
      - id: "01_hello"
        title: "Print и базовый вывод"
        emoji: "🟢"
        summary: "Команда print, аргументы sep/end/file/flush, escape-символы, sys.stdout, кодировки."
      - id: "02_variables"
        title: "Переменные и типы"
        emoji: "🔢"
        summary: "int/float/str/bool, объекты и ссылки, id, is vs ==, преобразования."
      - id: "03_strings"
        title: "Строки"
        emoji: "🔤"
        summary: "Срезы, методы, f-строки, форматирование, кодировки."
      - id: "04_operators"
        title: "Операторы и арифметика"
        emoji: "➗"
        summary: "+, -, *, /, //, %, **, приоритеты, целочисленные деления."
      - id: "05_io"
        title: "Ввод и вывод"
        emoji: "⌨️"
        summary: "input(), преобразование строк в числа, чтение нескольких значений."
      - id: "06_conditions"
        title: "Условия"
        emoji: "🔀"
        summary: "if/elif/else, тернарный оператор, match/case, истинность объектов."
      - id: "07_loops"
        title: "Циклы"
        emoji: "🔁"
        summary: "for, while, range, break, continue, итераторы под капотом."
      - id: "08_lists"
        title: "Списки и кортежи"
        emoji: "📋"
        summary: "Создание, методы, перебор, срезы, отличия списка от кортежа."
      - id: "09_dicts"
        title: "Словари"
        emoji: "🗂️"
        summary: "Ключ-значение, get, items, перебор, защита от KeyError, хеши."
      - id: "10_sets"
        title: "Множества"
        emoji: "🔵"
        summary: "Удаление дубликатов, объединение, пересечение, разность, frozenset."
      - id: "11_functions"
        title: "Функции"
        emoji: "🛠️"
        summary: "def, return, параметры по умолчанию, *args/**kwargs, аннотации."
      - id: "12_recursion"
        title: "Рекурсия"
        emoji: "♾️"
        summary: "Базовый случай, рекурсивный шаг, факториал, Фибоначчи, лимиты."
      - id: "13_files"
        title: "Файлы и JSON"
        emoji: "📄"
        summary: "open, with, чтение/запись, режимы, json.dump/load, pathlib."
      - id: "14_exceptions"
        title: "Исключения"
        emoji: "⚠️"
        summary: "try/except/finally, raise, свои классы исключений, traceback."
      - id: "15_oop"
        title: "ООП"
        emoji: "🏛️"
        summary: "Классы, __init__, наследование, super, @property, методы класса."
      - id: "16_comprehensions"
        title: "Comprehensions, lambda, map/filter"
        emoji: "✨"
        summary: "List/dict/set comprehensions, lambda, map, filter, reduce."

  advanced:
    title: "🚀 Продвинутый"
    description: |
      Глубокие темы для тех, кто прошёл «Начинающий». Внутренности CPython, модель
      памяти, GIL, дескрипторы, метаклассы, asyncio, типизация, тестирование,
      производительность. После прохождения ты понимаешь Python не как «команды»,
      а как систему.
    topics:
      - id: "17_memory_model"
        title: "Модель памяти Python"
        emoji: "🧠"
        summary: "Объекты, ссылки, id, is vs ==, mutable/immutable, intern, малые int."
      - id: "18_cpython_internals"
        title: "CPython под капотом"
        emoji: "⚙️"
        summary: "Байткод (dis), интерпретатор, .pyc, GC, reference counting."
      - id: "19_gil"
        title: "GIL"
        emoji: "🔒"
        summary: "Глобальная блокировка интерпретатора: что, зачем, когда мешает."
      - id: "20_descriptors"
        title: "Дескрипторы и __slots__"
        emoji: "📐"
        summary: "@property под капотом, дескрипторы, __slots__, ORM-валидаторы."
      - id: "21_metaclasses"
        title: "Метаклассы"
        emoji: "🧬"
        summary: "type как метакласс, __init_subclass__, ABC, использование на практике."
      - id: "22_mro"
        title: "MRO и множественное наследование"
        emoji: "🌳"
        summary: "Алгоритм C3, super() под капотом, диамантовая проблема."
      - id: "23_asyncio"
        title: "Корутины и asyncio"
        emoji: "⚡"
        summary: "async/await, event loop, Task, gather, отмена, backpressure."
      - id: "24_concurrency"
        title: "Многопоточность и многопроцессность"
        emoji: "🧵"
        summary: "threading, multiprocessing, concurrent.futures, когда что брать."
      - id: "25_typing"
        title: "Типизация по-взрослому"
        emoji: "🏷️"
        summary: "Generic, Protocol, TypeVar, ParamSpec, mypy/pyright, runtime checks."
      - id: "26_decorators"
        title: "Декораторы продвинутые"
        emoji: "🎁"
        summary: "Параметризованные, functools.wraps, реальные кейсы (cache/retry/validate)."
      - id: "27_testing"
        title: "Тестирование с pytest"
        emoji: "🧪"
        summary: "Фикстуры, моки, параметризация, coverage, тестовые паттерны."
      - id: "28_performance"
        title: "Производительность и профилирование"
        emoji: "📈"
        summary: "timeit, cProfile, py-spy, аллокации, оптимизация, антипаттерны."
