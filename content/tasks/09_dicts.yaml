topic_id: 09_dicts
tasks:
- id: 09_dicts-01
  topic_id: 09_dicts
  index: 1
  title: Телефонная книга
  statement: '### Задача 1. Телефонная книга


    Создай словарь, где ключ — имя, значение — телефон. Минимум 3 контакта. Выведи телефон одного из них.'
  reference: "\"\"\"Задача 1. Телефонная книга.\"\"\"\nphonebook = {\n    \"Алиса\": \"+7-911-111-11-11\",\n    \"Боб\":   \"+7-922-222-22-22\",\n    \"Карл\":  \"+7-933-333-33-33\",\n}\nprint(phonebook[\"Алиса\"])\n"
  check:
    kind: stdout
    expected_stdout: '+7-911-111-11-11

      '
- id: 09_dicts-02
  topic_id: 09_dicts
  index: 2
  title: Изменения в словаре
  statement: '### Задача 2. Изменения в словаре


    Дано:

    ```python

    prices = {"хлеб": 50, "молоко": 80}

    ```

    1. Добавь `"сыр": 350`.

    2. Обнови цену хлеба на 55.

    3. Удали молоко.

    4. Выведи итог.'
  reference: '"""Задача 2. Добавление, обновление, удаление."""

    prices = {"хлеб": 50, "молоко": 80}

    prices["сыр"] = 350           # добавить

    prices["хлеб"] = 55           # обновить

    del prices["молоко"]          # удалить

    print(prices)

    '
  check:
    kind: stdout
    expected_stdout: '{''хлеб'': 55, ''сыр'': 350}

      '
- id: 09_dicts-03
  topic_id: 09_dicts
  index: 3
  title: Безопасный доступ
  statement: '### Задача 3. Безопасный доступ


    Из словаря `prices = {"хлеб": 50, "молоко": 80}` попробуй:

    1. Получить значение для ключа `"сыр"` через `.get(...)` (без ошибки).

    2. То же, но с дефолтом `"нет в наличии"`.

    3. Проверить наличие ключа `"хлеб"` через `in`.'
  reference: '"""Задача 3. Безопасный доступ к ключу."""

    prices = {"хлеб": 50, "молоко": 80}

    # Безопасно — без ошибки

    print(prices.get("сыр"))                  # None

    print(prices.get("сыр", "нет в наличии")) # значение по умолчанию

    print("хлеб" in prices)                   # True

    '
  check:
    kind: stdout
    expected_stdout: 'None

      нет в наличии

      True

      '
- id: 09_dicts-04
  topic_id: 09_dicts
  index: 4
  title: Перебор словаря
  statement: '### Задача 4. Перебор словаря


    Дан словарь. Переберись по нему **тремя способами:** только по ключам, только по значениям, по парам.'
  reference: "\"\"\"Задача 4. Перебор словаря тремя способами.\"\"\"\nprices = {\"хлеб\": 50, \"молоко\": 80, \"сыр\": 350}\n\nprint(\"--- по ключам ---\")\nfor key in prices:\n    print(key)\n\nprint(\"--- по значениям ---\")\nfor value in prices.values():\n    print(value)\n\nprint(\"--- по парам ---\")\nfor key, value in prices.items():\n    print(f\"{key}: {value}\")\n"
  check:
    kind: stdout
    expected_stdout: '--- по ключам ---

      хлеб

      молоко

      сыр

      --- по значениям ---

      50

      80

      350

      --- по парам ---

      хлеб: 50

      молоко: 80

      сыр: 350

      '
- id: 09_dicts-05
  topic_id: 09_dicts
  index: 5
  title: Частота слов
  statement: '### Задача 5. Частота слов


    Дана строка `"кот пёс кот рыба пёс кот"`. Посчитай, сколько раз встречается каждое слово, и выведи словарь.


    *Подсказка:* `dict.get(key, 0) + 1`.'
  reference: "\"\"\"Задача 5. Подсчёт частоты слов в строке.\"\"\"\ntext = \"кот пёс кот рыба пёс кот\"\ncounts = {}\nfor word in text.split():\n    counts[word] = counts.get(word, 0) + 1\nprint(counts)\n"
  check:
    kind: stdout
    expected_stdout: '{''кот'': 3, ''пёс'': 2, ''рыба'': 1}

      '
- id: 09_dicts-06
  topic_id: 09_dicts
  index: 6
  title: Перевернуть словарь
  statement: '### Задача 6. Перевернуть словарь


    Дано `{"cat": "кот", "dog": "пёс", "fish": "рыба"}`. Получи обратное соответствие: ключ ↔ значение. Используй dict comprehension.'
  reference: '"""Задача 6. Перевернуть словарь — ключи и значения местами."""

    en_to_ru = {"cat": "кот", "dog": "пёс", "fish": "рыба"}

    ru_to_en = {v: k for k, v in en_to_ru.items()}

    print(ru_to_en)

    '
  check:
    kind: stdout
    expected_stdout: '{''кот'': ''cat'', ''пёс'': ''dog'', ''рыба'': ''fish''}

      '
- id: 09_dicts-07
  topic_id: 09_dicts
  index: 7
  title: Объединить словари
  statement: '### Задача 7. Объединить словари


    Слей два словаря (значения из второго перекрывают первого):

    ```python

    a = {"x": 1, "y": 2}

    b = {"y": 20, "z": 30}

    ```

    Должно получиться `{"x": 1, "y": 20, "z": 30}`.'
  reference: '"""Задача 7. Объединить два словаря (правый перекрывает левый)."""

    a = {"x": 1, "y": 2}

    b = {"y": 20, "z": 30}

    merged = {**a, **b}

    print(merged)

    # Альтернатива (Python 3.9+): merged = a | b

    '
  check:
    kind: stdout
    expected_stdout: '{''x'': 1, ''y'': 20, ''z'': 30}

      '
- id: 09_dicts-08
  topic_id: 09_dicts
  index: 8
  title: Сортировка по значению
  statement: '### Задача 8. Сортировка по значению


    Дан словарь оценок. Получи список пар `(имя, оценка)`, отсортированный по убыванию оценки.'
  reference: "\"\"\"Задача 8. Отсортировать словарь по значению (по убыванию).\"\"\"\nscores = {\"Алиса\": 87, \"Боб\": 92, \"Карл\": 75, \"Дина\": 95}\nsorted_pairs = sorted(scores.items(), key=lambda kv: kv[1], reverse=True)\nprint(sorted_pairs)\nfor name, score in sorted_pairs:\n    print(f\"{name}: {score}\")\n"
  check:
    kind: stdout
    expected_stdout: '[(''Дина'', 95), (''Боб'', 92), (''Алиса'', 87), (''Карл'', 75)]

      Дина: 95

      Боб: 92

      Алиса: 87

      Карл: 75

      '
- id: 09_dicts-09
  topic_id: 09_dicts
  index: 9
  title: Имя лучшего ученика
  statement: '### Задача 9. Имя лучшего ученика


    Из того же словаря оценок найди имя ученика с максимальным баллом.


    *Подсказка:* `max(d, key=d.get)`.'
  reference: '"""Задача 9. Найти ключ с максимальным значением."""

    scores = {"Алиса": 87, "Боб": 92, "Карл": 75, "Дина": 95}

    top = max(scores, key=scores.get)

    print(top, scores[top])

    '
  check:
    kind: stdout
    expected_stdout: 'Дина 95

      '
- id: 09_dicts-10
  topic_id: 09_dicts
  index: 10
  title: Сгруппировать имена по первой букве
  statement: '### Задача 10. Сгруппировать имена по первой букве


    Список имён: `["Анна", "Артём", "Борис", "Вера", "Виктор", "Алиса"]`. Получи словарь, где ключ — первая буква, значение — список имён на эту букву.


    *Подсказка:* `dict.setdefault(key, []).append(value)`.'
  reference: "\"\"\"Задача 10. Сгруппировать имена по первой букве.\"\"\"\nnames = [\"Анна\", \"Артём\", \"Борис\", \"Вера\", \"Виктор\", \"Алиса\"]\ngroups = {}\nfor name in names:\n    first = name[0]\n    groups.setdefault(first, []).append(name)\nprint(groups)\n"
  check:
    kind: stdout
    expected_stdout: '{''А'': [''Анна'', ''Артём'', ''Алиса''], ''Б'': [''Борис''], ''В'': [''Вера'', ''Виктор'']}

      '
