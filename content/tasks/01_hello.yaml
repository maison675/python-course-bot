- id: 01_hello-02
  topic_id: 01_hello
  index: 2
  title: Визитка
  statement: '### Задача 2. Визитка


    Выведи **одной** командой `print` строку:


    ```

    Меня зовут Алиса, мой любимый цвет — синий

    ```


    (Можешь заменить имя и цвет на свои.)'
  reference: '"""Задача 2. Вывести своё имя и любимый цвет в одной строке."""

    print("Меня зовут Алиса, мой любимый цвет — синий")

    '
  check:
    kind: stdout
    expected_stdout: 'Меня зовут Алиса, мой любимый цвет — синий

      '
- id: 01_hello-03
  topic_id: 01_hello
  index: 3
  title: Три строки
  statement: '### Задача 3. Три строки


    Выведи три слова, каждое — на своей строке:


    ```

    Раз

    Два

    Три

    ```'
  reference: '"""Задача 3. Вывести три строки: ''Раз'', ''Два'', ''Три'' — каждая на своей строке."""

    print("Раз")

    print("Два")

    print("Три")

    '
  check:
    kind: stdout
    expected_stdout: 'Раз

      Два

      Три

      '
- id: 01_hello-04
  topic_id: 01_hello
  index: 4
  title: Разделитель `sep`
  statement: '### Задача 4. Разделитель `sep`


    Используя **один** вызов `print` с тремя аргументами, выведи:


    ```

    красный-зелёный-синий

    ```


    *Подсказка:* у `print` есть параметр `sep` — разделитель между аргументами.'
  reference: '"""Задача 4. Вывести три слова в одной строке через дефис: ''красный-зелёный-синий''.

    Подсказка: используй параметр sep у функции print."""

    print("красный", "зелёный", "синий", sep="-")

    '
  check:
    kind: stdout
    expected_stdout: 'красный-зелёный-синий

      '
- id: 01_hello-05
  topic_id: 01_hello
  index: 5
  title: Параметр `end`
  statement: '### Задача 5. Параметр `end`


    Сделай так, чтобы **два разных** `print` вывели результат в одной строке (с пробелом между фразами):


    ```

    Привет, мир!

    ```


    *Подсказка:* у `print` есть параметр `end` — что добавить в конце.'
  reference: '"""Задача 5. Вывести два print подряд так, чтобы они оказались на одной строке.

    Между ними должен быть пробел.

    Подсказка: используй параметр end."""

    print("Привет,", end=" ")

    print("мир!")

    '
  check:
    kind: stdout
    expected_stdout: 'Привет, мир!

      '
- id: 01_hello-06
  topic_id: 01_hello
  index: 6
  title: Кавычки и слэш
  statement: '### Задача 6. Кавычки и слэш


    Выведи **точно** такую строку, включая двойные кавычки, апостроф и обратный слэш:


    ```

    She said: "Hello\world''s"

    ```'
  reference: '"""Задача 6. Вывести строку, содержащую двойную кавычку, апостроф и обратный слэш:

    She said: "Hello\\world''s"

    """

    print("She said: \"Hello\\world''s\"")

    '
  check:
    kind: stdout
    expected_stdout: 'She said: "Hello\world''s"

      '
- id: 01_hello-07
  topic_id: 01_hello
  index: 7
  title: Один print, несколько строк
  statement: "### Задача 7. Один print, несколько строк\n\nИспользуя **один** `print`, выведи (между словами — табуляция, между строками — перенос):\n\n```\nИмя:\tАлиса\nВозраст:\t25\n```"
  reference: '"""Задача 7. Используя один print, вывести две строки с переносом и табуляцией:

    Имя:\\tАлиса

    Возраст:\\t25

    """

    print("Имя:\tАлиса\nВозраст:\t25")

    '
  check:
    kind: stdout
    expected_stdout: "Имя:\tАлиса\nВозраст:\t25\n"
- id: 01_hello-08
  topic_id: 01_hello
  index: 8
  title: Линия
  statement: '### Задача 8. Линия


    Выведи разделительную линию из **30** символов `=`, **не** печатая их вручную:


    ```

    ==============================

    ```


    *Подсказка:* строку можно умножать на число.'
  reference: '"""Задача 8. Вывести разделительную линию из 30 одинаковых символов ''='',

    не печатая их вручную.

    Подсказка: строку можно умножать на число."""

    print("=" * 30)

    '
  check:
    kind: stdout
    expected_stdout: '==============================

      '
- id: 01_hello-09
  topic_id: 01_hello
  index: 9
  title: Треугольник
  statement: '### Задача 9. Треугольник


    Выведи треугольник из звёздочек:


    ```

    *

    **

    ***

    ****

    *****

    ```


    *Можешь использовать цикл `for` (раздел 9 учебника), но это не обязательно — можно и пятью print.*'
  reference: "\"\"\"Задача 9. Вывести треугольник из звёздочек высотой 5:\n*\n**\n***\n****\n*****\n\"\"\"\nfor i in range(1, 6):\n    print(\"*\" * i)\n"
  check:
    kind: stdout
    expected_stdout: '*

      **

      ***

      ****

      *****

      '
- id: 01_hello-10
  topic_id: 01_hello
  index: 10
  title: Карточка
  statement: '### Задача 10. Карточка


    Выведи «карточку» **точно** в таком виде:


    ```

    +--------------------+

    |   Python — это   |

    |     круто!         |

    +--------------------+

    ```'
  reference: '"""Задача 10. Вывести «карточку» строго в таком виде (включая рамку):

    +--------------------+

    |   Python — это   |

    |     круто!         |

    +--------------------+


    Решение должно использовать print несколько раз, без сложных функций.

    """

    print("+--------------------+")

    print("|   Python — это   |")

    print("|     круто!         |")

    print("+--------------------+")

    '
  check:
    kind: stdout
    expected_stdout: '+--------------------+

      |   Python — это   |

      |     круто!         |

      +--------------------+

      '
