topic_id: 10_sets
tasks:
- id: 10_sets-01
  topic_id: 10_sets
  index: 1
  title: Создание и изменение
  statement: '### Задача 1. Множество фруктов


    Создай множество с двумя фруктами: `яблоко` и `банан`. Добавь в него `вишня`,

    попробуй добавить `яблоко` повторно (что произойдёт?), удали `банан`.


    Выведи отсортированный список оставшихся фруктов и их количество.


    Подсказка: используй `print(sorted(s))`, чтобы вывод был детерминированным.'
  reference: '"""Задача 1. Создать множество и добавить/удалить элементы."""

    fruits = {"яблоко", "банан"}

    fruits.add("вишня")

    fruits.add("яблоко")     # дубликат — игнорируется

    fruits.discard("банан")  # удалить

    print(sorted(fruits))

    print(len(fruits))

    '
  check:
    kind: stdout
    expected_stdout: '[''вишня'', ''яблоко'']

      2

      '
- id: 10_sets-02
  topic_id: 10_sets
  index: 2
  title: Дубликаты в списке
  statement: '### Задача 2. Дубликаты в списке


    Из списка `[1, 2, 3, 1, 4, 2, 5, 1]` убери дубликаты через `set`. (Порядок не гарантируется — выведи отсортированно для стабильности.)'
  reference: '"""Задача 2. Удалить дубликаты из списка через set (порядок может измениться)."""

    nums = [1, 2, 3, 1, 4, 2, 5, 1]

    unique = list(set(nums))

    print(sorted(unique))   # отсортируем для воспроизводимости вывода

    '
  check:
    kind: stdout
    expected_stdout: '[1, 2, 3, 4, 5]

      '
- id: 10_sets-03
  topic_id: 10_sets
  index: 3
  title: Пересечение
  statement: '### Задача 3. Пересечение множеств


    Найди пересечение двух множеств `{1, 2, 3, 4, 5}` и `{3, 4, 5, 6, 7}`

    двумя способами: оператором `&` и методом `.intersection()`.


    Выведи оба результата в виде отсортированного списка.'
  reference: '"""Задача 3. Пересечение множеств."""

    a = {1, 2, 3, 4, 5}

    b = {3, 4, 5, 6, 7}

    print(sorted(a & b))

    print(sorted(a.intersection(b)))

    '
  check:
    kind: stdout
    expected_stdout: '[3, 4, 5]

      [3, 4, 5]

      '
- id: 10_sets-04
  topic_id: 10_sets
  index: 4
  title: Объединение
  statement: '### Задача 4. Объединение


    Объедини `{1, 2, 3}` и `{3, 4, 5}` через `|`.'
  reference: '"""Задача 4. Объединение двух множеств."""

    a = {1, 2, 3}

    b = {3, 4, 5}

    print(sorted(a | b))

    '
  check:
    kind: stdout
    expected_stdout: '[1, 2, 3, 4, 5]

      '
- id: 10_sets-05
  topic_id: 10_sets
  index: 5
  title: Разность
  statement: '### Задача 5. Разность


    Найди элементы, которые есть в первом множестве, но нет во втором: `{1,2,3,4,5} - {3,4,5,6,7}`.'
  reference: '"""Задача 5. Разность множеств — есть в a, но нет в b."""

    a = {1, 2, 3, 4, 5}

    b = {3, 4, 5, 6, 7}

    print(sorted(a - b))

    '
  check:
    kind: stdout
    expected_stdout: '[1, 2]

      '
- id: 10_sets-06
  topic_id: 10_sets
  index: 6
  title: Симметрическая разность
  statement: '### Задача 6. Симметрическая разность


    Найди элементы, которые есть только в одном из множеств: `{1,2,3,4,5} ^ {3,4,5,6,7}`.'
  reference: '"""Задача 6. Симметрическая разность — есть только в одном из множеств."""

    a = {1, 2, 3, 4, 5}

    b = {3, 4, 5, 6, 7}

    print(sorted(a ^ b))

    '
  check:
    kind: stdout
    expected_stdout: '[1, 2, 6, 7]

      '
- id: 10_sets-07
  topic_id: 10_sets
  index: 7
  title: Подмножество?
  statement: '### Задача 7. Подмножество?


    Проверь, является ли `{1, 2, 3}` подмножеством `{1, 2, 3, 4, 5}`. Покажи через метод `.issubset()` и через оператор `<=`.'
  reference: '"""Задача 7. Является ли подмножеством."""

    a = {1, 2, 3}

    b = {1, 2, 3, 4, 5}

    print(a.issubset(b))    # True

    print(a <= b)           # True

    print(b.issuperset(a))  # True

    '
  check:
    kind: stdout
    expected_stdout: 'True

      True

      True

      '
- id: 10_sets-08
  topic_id: 10_sets
  index: 8
  title: Общие буквы
  statement: '### Задача 8. Общие буквы


    Дано: `w1 = "программирование"`, `w2 = "математика"`. Найди буквы, встречающиеся в обоих словах.'
  reference: '"""Задача 8. Общие буквы в двух словах."""

    w1 = "программирование"

    w2 = "математика"

    common = set(w1) & set(w2)

    print(sorted(common))

    '
  check:
    kind: stdout
    expected_stdout: '[''а'', ''е'', ''и'', ''м'']

      '
- id: 10_sets-09
  topic_id: 10_sets
  index: 9
  title: Уникальные символы
  statement: '### Задача 9. Уникальные символы


    В строке `"Hello, World!"` сколько различных символов?'
  reference: '"""Задача 9. Сколько уникальных символов в строке?"""

    s = "Hello, World!"

    print(len(set(s)))

    '
  check:
    kind: stdout
    expected_stdout: '10

      '
- id: 10_sets-10
  topic_id: 10_sets
  index: 10
  title: frozenset
  statement: '### Задача 10. frozenset


    `frozenset` — неизменяемое множество. Используется как **ключ словаря** (обычный `set` нельзя). Создай `frozenset` из `[1,2,3]`, используй его как ключ словаря и обратись по нему.'
  reference: '"""Задача 10. Frozenset — неизменяемое множество.

    Удобен как ключ словаря (обычный set нельзя использовать как ключ)."""

    fs = frozenset([1, 2, 3])

    d = {fs: "первая группа"}

    print(d[fs])

    # fs.add(4)   # AttributeError — frozenset нельзя менять

    '
  check:
    kind: stdout
    expected_stdout: 'первая группа

      '
