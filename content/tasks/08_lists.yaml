topic_id: 08_lists
tasks:
- id: 08_lists-01
  topic_id: 08_lists
  index: 1
  title: Сумма списка
  statement: '### Задача 1. Сумма списка


    Дан список `[4, 7, 1, 9, 3, 2]`. Найди сумму элементов **через цикл**, не используя `sum`.'
  reference: "\"\"\"Задача 1. Сумма всех элементов списка через цикл.\"\"\"\nnums = [4, 7, 1, 9, 3, 2]\ntotal = 0\nfor x in nums:\n    total += x\nprint(total)\n"
  check:
    kind: stdout
    expected_stdout: '26

      '
- id: 08_lists-02
  topic_id: 08_lists
  index: 2
  title: Максимум и минимум
  statement: '### Задача 2. Максимум и минимум


    Найди максимум и минимум списка `[4, 7, 1, 9, 3, 2]` **без `max`/`min`** — только через цикл.'
  reference: "\"\"\"Задача 2. Максимум и минимум списка БЕЗ функций max/min.\"\"\"\nnums = [4, 7, 1, 9, 3, 2]\nbiggest = nums[0]\nsmallest = nums[0]\nfor x in nums[1:]:\n    if x > biggest:\n        biggest = x\n    if x < smallest:\n        smallest = x\nprint(\"max =\", biggest)\nprint(\"min =\", smallest)\n"
  check:
    kind: stdout
    expected_stdout: 'max = 9

      min = 1

      '
- id: 08_lists-03
  topic_id: 08_lists
  index: 3
  title: Среднее
  statement: '### Задача 3. Среднее


    Найди среднее арифметическое того же списка.'
  reference: '"""Задача 3. Среднее арифметическое списка."""

    nums = [4, 7, 1, 9, 3, 2]

    avg = sum(nums) / len(nums)

    print(avg)

    '
  check:
    kind: stdout
    expected_stdout: '4.333333333333333

      '
- id: 08_lists-04
  topic_id: 08_lists
  index: 4
  title: Только чётные
  statement: '### Задача 4. Только чётные


    Из списка `[4, 7, 1, 9, 3, 2, 8, 11]` оставь только чётные элементы. Используй `append`.'
  reference: "\"\"\"Задача 4. Только чётные элементы списка.\"\"\"\nnums = [4, 7, 1, 9, 3, 2, 8, 11]\nevens = []\nfor x in nums:\n    if x % 2 == 0:\n        evens.append(x)\nprint(evens)\n"
  check:
    kind: stdout
    expected_stdout: '[4, 2, 8]

      '
- id: 08_lists-05
  topic_id: 08_lists
  index: 5
  title: Развернуть список
  statement: '### Задача 5. Развернуть список


    Дан список `[1, 2, 3, 4, 5]`. Получи `[5, 4, 3, 2, 1]` **тремя разными способами**:

    1. срезом,

    2. функцией `reversed`,

    3. методом `.reverse()`.'
  reference: '"""Задача 5. Развернуть список тремя способами."""

    nums = [1, 2, 3, 4, 5]


    # 1) Срез — создаёт новый список

    print(nums[::-1])


    # 2) Метод reversed (возвращает итератор)

    print(list(reversed(nums)))


    # 3) Метод .reverse() — изменяет на месте

    copy = nums.copy()

    copy.reverse()

    print(copy)

    '
  check:
    kind: stdout
    expected_stdout: '[5, 4, 3, 2, 1]

      [5, 4, 3, 2, 1]

      [5, 4, 3, 2, 1]

      '
- id: 08_lists-06
  topic_id: 08_lists
  index: 6
  title: Сколько раз встречается?
  statement: '### Задача 6. Сколько раз встречается?


    В списке `[1, 2, 3, 2, 4, 2, 5, 1]` посчитай, сколько раз встречается число `2`.'
  reference: '"""Задача 6. Сколько раз встречается элемент."""

    nums = [1, 2, 3, 2, 4, 2, 5, 1]

    print(nums.count(2))

    '
  check:
    kind: stdout
    expected_stdout: '3

      '
- id: 08_lists-07
  topic_id: 08_lists
  index: 7
  title: Индекс максимума
  statement: '### Задача 7. Индекс максимума


    Найди **индекс** максимального элемента в `[4, 7, 1, 9, 3, 9, 2]`. Если максимум встречается несколько раз — вернуть индекс первого вхождения.'
  reference: "\"\"\"Задача 7. Индекс максимального элемента.\"\"\"\nnums = [4, 7, 1, 9, 3, 9, 2]\nbest_idx = 0\nfor i in range(1, len(nums)):\n    if nums[i] > nums[best_idx]:\n        best_idx = i\nprint(best_idx)\n"
  check:
    kind: stdout
    expected_stdout: '3

      '
- id: 08_lists-08
  topic_id: 08_lists
  index: 8
  title: Удалить дубликаты, сохранив порядок
  statement: '### Задача 8. Удалить дубликаты, сохранив порядок


    Дано `[1, 2, 1, 3, 2, 4, 1, 5]`. Получи `[1, 2, 3, 4, 5]` — **порядок первого появления** должен сохраниться.


    *Подсказка:* подмени `set` для проверки «уже видели?».'
  reference: "\"\"\"Задача 8. Удалить дубликаты, СОХРАНИВ порядок.\"\"\"\nnums = [1, 2, 1, 3, 2, 4, 1, 5]\nseen = set()\nunique = []\nfor x in nums:\n    if x not in seen:\n        seen.add(x)\n        unique.append(x)\nprint(unique)\n"
  check:
    kind: stdout
    expected_stdout: '[1, 2, 3, 4, 5]

      '
- id: 08_lists-09
  topic_id: 08_lists
  index: 9
  title: Сортировка по длине
  statement: '### Задача 9. Сортировка по длине


    Дан список слов `["банан", "яблоко", "виноград", "груша", "ананас"]`. Отсортируй по длине слова.


    *Подсказка:* `sorted(..., key=len)`.'
  reference: '"""Задача 9. Отсортировать список строк по длине."""

    words = ["банан", "яблоко", "виноград", "груша", "ананас"]

    sorted_words = sorted(words, key=len)

    print(sorted_words)

    '
  check:
    kind: stdout
    expected_stdout: '[''банан'', ''груша'', ''яблоко'', ''ананас'', ''виноград'']

      '
- id: 08_lists-10
  topic_id: 08_lists
  index: 10
  title: Парный обход через zip
  statement: '### Задача 10. Парный обход через zip


    Даны:

    ```python

    names = ["Алиса", "Боб", "Карл"]

    ages = [25, 30, 22]

    ```

    Сделай список пар `[("Алиса", 25), ...]` и выведи по строкам в формате `Имя: возраст лет`.'
  reference: "\"\"\"Задача 10. Объединить два списка в список пар через zip.\"\"\"\nnames = [\"Алиса\", \"Боб\", \"Карл\"]\nages = [25, 30, 22]\npairs = list(zip(names, ages))\nprint(pairs)\nfor name, age in pairs:\n    print(f\"{name}: {age} лет\")\n"
  check:
    kind: stdout
    expected_stdout: '[(''Алиса'', 25), (''Боб'', 30), (''Карл'', 22)]

      Алиса: 25 лет

      Боб: 30 лет

      Карл: 22 лет

      '
