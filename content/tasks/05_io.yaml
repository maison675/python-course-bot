  title: Меняем местами
  statement: '### Задача 9. Меняем местами


    Прочитать имя и фамилию (на разных строках). Вывести «Фамилия Имя».'
  reference: '"""Задача 9. Прочитать имя и фамилию (две отдельные строки) и вывести их в обратном порядке."""

    # first = input("Имя: ")

    # last = input("Фамилия: ")

    first = "Иван"

    last = "Петров"

    print(f"{last} {first}")

    '
  check:
