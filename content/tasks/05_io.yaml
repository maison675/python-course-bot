  title: Сумма двух
  statement: '### Задача 2. Сумма двух


    Программа просит ввести два целых числа (на двух строках) и выводит их сумму.'
  reference: '"""Задача 2. Спросить два числа и вывести их сумму.

    ВНИМАНИЕ: input() возвращает строку, нужно преобразовать к int."""

    # a = int(input("Первое число: "))

    # b = int(input("Второе число: "))

    a, b = 7, 13

    print(a + b)

    '
  check:
    kind: stdout
    expected_stdout: '20

      '
    stdin: '7

      13

      '
  needs_stdin: true
