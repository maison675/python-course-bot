  title: Квадрат числа
  statement: '### Задача 3. Квадрат числа


    Программа просит число и выводит его квадрат.'
  reference: '"""Задача 3. Прочитать строку с числом и вывести его квадрат."""

    # s = input("Введите число: ")

    s = "9"

    n = int(s)

    print(n * n)

    '
  check:
    kind: stdout
    expected_stdout: '81

      '
    stdin: '9

      '
  needs_stdin: true
