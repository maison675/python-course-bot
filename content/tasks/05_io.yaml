  title: Площадь круга
  statement: '### Задача 6. Площадь круга


    Прочитать радиус (с дробной частью!) и вывести площадь круга с двумя знаками после запятой.'
  reference: '"""Задача 6. Прочитать радиус и посчитать площадь круга."""

    import math

    # r = float(input("Радиус: "))

    r = 5.0

    print(f"S = {math.pi * r ** 2:.2f}")

    '
