  title: Приветствие
  statement: '### Задача 1. Приветствие


    Программа спрашивает имя и выводит «Привет, ...!».'
  reference: '"""Задача 1. Спросить имя и поздороваться.

    Реальная версия использует input(); здесь — захардкоженный ввод для самопроверки."""

    # name = input("Как тебя зовут? ")

    name = "Алиса"

    print(f"Привет, {name}!")

    '
  check:
    kind: stdout
