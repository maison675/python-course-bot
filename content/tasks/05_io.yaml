      '
    stdin: 'Иван

      Петров

      '
  needs_stdin: true
- id: 05_io-10
  topic_id: 05_io
  index: 10
  title: Калькулятор
  statement: '### Задача 10. Калькулятор


    Прочитать: число `a`, знак операции (`+`, `-`, `*`, `/`), число `b`. Вывести результат соответствующей операции. Если знак не из четырёх — вывести «Неизвестная операция».'
  reference: "\"\"\"Задача 10. Простой калькулятор.\nПрочитать число, операцию (+ - * /), число. Вывести результат.\"\"\"\n# a = float(input(\"a = \"))\n# op = input(\"op = \")\n# b = float(input(\"b = \"))\na, op, b = 12, \"*\", 4\nif op == \"+\":\n    print(a + b)\nelif op == \"-\":\n    print(a - b)\nelif op == \"*\":\n    print(a * b)\nelif op == \"/\":\n    print(a / b)\nelse:\n    print(\"Неизвестная операция\")\n"
  check:
    kind: stdout
    expected_stdout: '48

      '
    stdin: '12

      *

      4

      '
  needs_stdin: true
