  needs_stdin: true
- id: 05_io-07
  topic_id: 05_io
  index: 7
  title: Два числа в одной строке
  statement: '### Задача 7. Два числа в одной строке


    Пользователь вводит два числа в **одной** строке через пробел: `7 13`. Прочитай их и выведи сумму.


    *Подсказка:* `input().split()` разбивает по пробелам, `map(int, ...)` превращает каждый кусочек в `int`.'
  reference: '"""Задача 7. Прочитать ДВА числа в ОДНОЙ строке через пробел и вывести их сумму.

    Например, ввод: ''7 13'' → 20."""

    # line = input("Два числа через пробел: ")

    line = "7 13"

    a, b = map(int, line.split())

    print(a + b)

    '
  check:
    kind: stdout
    expected_stdout: '20

      '
    stdin: '7 13

      '
  needs_stdin: true
- id: 05_io-08
  topic_id: 05_io
  index: 8
  title: Таблица квадратов
  statement: '### Задача 8. Таблица квадратов


    Прочитать `N` и вывести таблицу: число и его квадрат, через табуляцию, для всех чисел от 1 до N включительно.'
  reference: "\"\"\"Задача 8. Прочитать число N и вывести таблицу квадратов от 1 до N.\"\"\"\n# n = int(input(\"N = \"))\nn = 5\nfor i in range(1, n + 1):\n    print(f\"{i}\\t{i * i}\")\n"
  check:
    kind: stdout
    expected_stdout: "1\t1\n2\t4\n3\t9\n4\t16\n5\t25\n"
    stdin: '5

      '
  needs_stdin: true
